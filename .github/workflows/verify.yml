name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      GRANDAREA_REQUIRE_PHP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify PHP runtime
        run: php --version
      - run: npm run verify
      - run: npm run lint
      - run: npm run format:check
      - run: npm run playtest:ready
